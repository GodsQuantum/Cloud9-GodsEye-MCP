name: Verify all four Gods Eye MCP tools and publish GHCR
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: godseye-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and interface contract
        run: python3 tests/privacy.py
      - uses: docker/setup-buildx-action@v3
      - name: Build current MCP SDK and unmodified specialized adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: local/cloud9-godseye-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Live HTTP four-tool schema and fake upstream functional regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -e GODS_EYE_BASE_URL=http://127.0.0.1:4173 \
            -e MCP_ALLOWED_HOSTS=127.0.0.1:18768 \
            -v "$PWD/tests:/contract:ro" \
            --entrypoint sh local/cloud9-godseye-mcp:test -c '
              python /contract/mock_backend.py >/tmp/mock.log 2>&1 &
              mock=$!
              python /app/mcp_server.py --host 0.0.0.0 --port 18768 >/tmp/mcp.log 2>&1 &
              mcp=$!
              sleep 4
              python /contract/verify_tools.py || {
                tail -25 /tmp/mcp.log
                exit 1
              }
              kill "$mock" "$mcp" 2>/dev/null || true
              echo ALL_FOUR_SPECIALIST_CONTEXT_TOOLS_PASS
            '
  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/godsquantum/cloud9-godseye-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

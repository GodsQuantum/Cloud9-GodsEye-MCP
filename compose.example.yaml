name: cloud9-godseye-mcp
services:
  godseye-mcp:
    image: ghcr.io/godsquantum/cloud9-godseye-mcp:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18768:18768"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',18768),timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
